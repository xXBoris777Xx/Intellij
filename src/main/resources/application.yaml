server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: Herramientas-Matutuino

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  datasource:
    productos:
      url: ${PRODUCTOS_DB_URL:jdbc:postgresql://localhost:5432/productos_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver
    pedidos:
      url: ${PEDIDOS_DB_URL:jdbc:postgresql://localhost:5432/pedidos_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver